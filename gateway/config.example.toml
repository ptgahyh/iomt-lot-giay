# Cấu hình gateway. Chép file này thành config.toml rồi sửa.
# config.toml chứa token và khóa nên KHÔNG được đẩy lên GitHub (.gitignore đã chặn).
# Sau khi chép, chạy:  python tools/genkeys.py config.toml   để thay khóa thử bằng khóa thật.

db_path = "gateway.db"
log_level = "INFO"          # DEBUG khi cần xem từng gói
warn_after = 2.0            # quá 2 chu kỳ không nghe thấy -> WARNING
lost_after = 4.0            # quá 4 chu kỳ -> DISCONNECTED

[lora]
enabled = true
port = "COM5"               # cổng của ESP32 cầu nối (Device Manager). Thử không phần cứng: "socket://127.0.0.1:7000"
baud = 115200
mode = "free"               # free: node gửi lúc nào cũng được | tdma: chia khe theo beacon | poll: laptop hỏi lần lượt
net_key = "2B7E151628AED2A6ABF7158809CF4F3C"   # KHÓA THỬ (RFC 4493), dùng ký beacon
slot_ms = 2000              # độ dài 1 khe (tdma)
free_slots = 5              # số khe tự do cuối chu kỳ cho báo động / HELLO (tdma)
beacon_period_s = 60        # chu kỳ beacon (tdma)
poll_timeout_s = 1.0        # chờ trả lời mỗi lần hỏi (poll)

[mqtt]                      # Mosquitto trên laptop, cho kẹp tay
enabled = true
host = "127.0.0.1"
port = 1883
username = "gateway"        # tuần 3 bật mật khẩu thì điền
password = ""
topic_prefix = "iomt/wrist"

[modbus]                    # giường qua USB-RS485
enabled = true
method = "rtu"              # rtu: cổng COM thật | tcp: thử với sim/bed_modbus_sim.py --tcp
port = "COM6"               # rtu: "COM6"; tcp: "127.0.0.1:5020"
baud = 9600
timeout_s = 0.5
poll_s = 2.0

[cloud]                     # ThingsBoard
enabled = true
host = "thingsboard.cloud"
port = 1883
token = ""                  # Access token của thiết bị gateway (tick "Is gateway")
batch = 50

# ---------------------------------------------------------------- sổ đăng ký node
# id 1..254, không trùng. name là tên hiện trên ThingsBoard, không trùng.
# insole: cần key (32 ký tự hex) và slot (khi mode = "tdma").
# wrist:  id phải khớp topic iomt/wrist/<id>/...
# bed:    unit_id là địa chỉ Modbus (mặc định = id).
# patient: nối các node của cùng một bệnh nhân (dùng để kiểm tra chéo ngã với giường).

[[nodes]]   # lót giày thật (mạch BME3)
