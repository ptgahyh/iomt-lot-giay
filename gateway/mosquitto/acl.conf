# ACL cho Mosquitto (tuần 3, TV3). Mỗi kẹp tay đăng nhập với username = id của nó (ví dụ "21"),
# nên %u trong pattern chính là id: kẹp tay 21 chỉ ghi được iomt/wrist/21/..., không ghi được của người khác.

# Gateway: đọc số liệu + xác nhận của mọi kẹp tay, ghi lệnh xuống
user gateway
topic read iomt/wrist/+/telemetry
topic read iomt/wrist/+/ack
topic write iomt/wrist/+/cmd

# Mọi kẹp tay (áp dụng cho mọi user đã đăng nhập)
pattern write iomt/wrist/%u/telemetry
pattern write iomt/wrist/%u/ack
pattern read iomt/wrist/%u/cmd
