# Cấu hình Mosquitto 2.x cho laptop gateway (tuần 3, TV3 + TV2).
# Chạy thử ở cửa sổ cmd:  mosquitto -c mosquitto.conf -v
#
# Tạo file mật khẩu (lần đầu dùng -c để tạo mới, các lần sau bỏ -c):
#   mosquitto_passwd -c passwd gateway
#   mosquitto_passwd passwd 21          <- mỗi kẹp tay một user, tên = id của nó
#   mosquitto_passwd passwd 22
# Dùng ĐƯỜNG DẪN ĐẦY ĐỦ cho 2 file bên dưới (đường dẫn tương đối hay bị lỗi
# "Unable to open pwfile" vì Mosquitto không chạy từ thư mục bạn nghĩ).
# Nhớ mở cổng 1883 trong Windows Firewall (mạng Private) để ESP32 nối vào được.

listener 1883 0.0.0.0
allow_anonymous false
password_file C:\iomt\mosquitto\passwd
acl_file C:\iomt\mosquitto\acl.conf
