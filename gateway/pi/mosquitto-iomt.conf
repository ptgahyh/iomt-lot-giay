# Cấu hình Mosquitto 2.x cho gateway chạy Linux (Raspberry Pi). cai_dat.sh chép file này vào
# /etc/mosquitto/conf.d/iomt.conf. Bản cho Windows: ../mosquitto/mosquitto.conf.
#
# Thêm một kẹp tay mới sau này (user = id của nó):
#   sudo mosquitto_passwd /etc/mosquitto/iomt-passwd 27 && sudo systemctl restart mosquitto

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/iomt-passwd
acl_file /etc/mosquitto/iomt-acl.conf
